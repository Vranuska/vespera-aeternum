name: Deploy Lovable archive to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "15 21 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-lovable-site.yml"
      - "entries.json"
      - "editorial/**"
      - "bestiario.json"
      - "atlas.json"
      - "assets/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vespera-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Lovable application
        uses: actions/checkout@v4
        with:
          repository: Vranuska/vespera-aeternum-blog
          ref: main
          path: app

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Validate synchronized archive snapshots
        working-directory: app
        run: |
          curl -fsSL https://raw.githubusercontent.com/Vranuska/vespera-aeternum/main/entries.json -o /tmp/entries.json
          cmp -s /tmp/entries.json src/data/entries-fallback.json
          curl -fsSL https://raw.githubusercontent.com/Vranuska/vespera-aeternum/main/editorial/indice-romance-mosaico.json -o /tmp/editorial.json
          cmp -s /tmp/editorial.json src/data/editorial-fallback.json
          bun -e 'const entries = await Bun.file("src/data/entries-fallback.json").json(); const editorial = await Bun.file("src/data/editorial-fallback.json").json(); const ids = new Set(entries.map((entry) => entry.id)); const indexed = [...editorial.universe_chronology, ...editorial.unplaced_archive].map((item) => item.entry_id); const chapters = editorial.editorial_reading_order.chapters.map((item) => item.entry_id); if (indexed.length !== ids.size || new Set(indexed).size !== ids.size || indexed.some((id) => !ids.has(id))) throw new Error("O índice editorial não cobre exatamente o arquivo offline."); if (chapters.some((id) => !ids.has(id)) || new Set(chapters).size !== chapters.length) throw new Error("A ordem de leitura contém IDs ausentes ou duplicados."); for (const entry of entries) for (const id of entry.related_entries ?? []) if (!ids.has(id)) throw new Error("Referência relacionada ausente: " + id); console.log(entries.length + " obras; " + chapters.length + " capítulos; " + editorial.universe_chronology.length + " itens cronológicos; " + editorial.unplaced_archive.length + " fora da cronologia; vínculos válidos.");'

      - name: Validate canonical Bestiary and Atlas snapshots
        working-directory: app
        run: |
          curl -fsSL https://raw.githubusercontent.com/Vranuska/vespera-aeternum/main/bestiario.json -o /tmp/bestiario.json
          curl -fsSL https://raw.githubusercontent.com/Vranuska/vespera-aeternum/main/atlas.json -o /tmp/atlas.json
          cmp -s /tmp/bestiario.json src/data/bestiary-fallback.json
          cmp -s /tmp/atlas.json src/data/atlas-fallback.json
          bun -e 'const bestiary = await Bun.file("src/data/bestiary-fallback.json").json(); const atlas = await Bun.file("src/data/atlas-fallback.json").json(); if (!bestiary.entries?.length || !Array.isArray(bestiary.mentions)) throw new Error("Snapshot do Bestiário inválido."); if (!atlas.places?.length || !atlas.realms?.length) throw new Error("Snapshot do Atlas inválido."); for (const place of atlas.places) for (const id of place.source_entry_ids ?? []) if (typeof id !== "string" || !id) throw new Error("Fonte inválida no Atlas: " + place.id); console.log(bestiary.entries.length + " dossiê(s) canônico(s); " + bestiary.mentions.length + " menções; " + atlas.places.length + " lugares; snapshots sincronizados.");'

      - name: Run archive, continuity and attribution regression tests
        working-directory: app
        run: bun run test

      - name: Build prerendered archive from synchronized snapshots
        working-directory: app
        run: bun run build

      - name: Prepare project-site root and verify output
        run: |
          test -d app/.output/public/vespera-aeternum
          cp -a app/.output/public/vespera-aeternum/. app/.output/public/
          rm -rf app/.output/public/vespera-aeternum
          test -s app/.output/public/index.html
          grep -q "Vespera" app/.output/public/index.html
          cp app/.output/public/index.html app/.output/public/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/.output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
