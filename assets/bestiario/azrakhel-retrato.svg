<title id="t">Azrakhel, retrato de arquivo</title>
<desc id="d">Uma figura demoníaca de quase três metros, com chifres negros, armadura de ossos, olhos de carvão e uma capa feita de sombra viva, diante de um arco escuro.</desc>
