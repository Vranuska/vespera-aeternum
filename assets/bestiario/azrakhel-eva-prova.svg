<title id="t">Azrakhel acompanha Eva na prova de seus sapatos</title>
<desc id="d">Num ateliê de calçado, uma menina sem chifres escolhe um sapato de couro com pequenas estrelas prateadas bordadas por dentro. Ao lado, o pai demoníaco observa sem interferir.</desc>
